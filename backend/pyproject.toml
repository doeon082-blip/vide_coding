[project]
name = "festival-backend"
version = "0.1.0"
description = "Festival info + local AI curation backend"
authors = [
    { name = "귀염뽀작도언이", email = "doeon082@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pyproj>=3.8.0",
    "pyshp>=3.1.9",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
