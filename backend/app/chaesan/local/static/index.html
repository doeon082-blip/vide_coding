<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채산 · 한체산 데이터 길라잡이 (비공식)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--sub:#5b6676;--line:#dfe3ea;--brand:#0b6b57;--brand-ink:#fff;--warn:#8a5a00;--warn-bg:#fff4d6;--err:#a12a2a;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf3;--sub:#9aa7b7;--line:#2a3441;--brand:#3cc9a5;--brand-ink:#04251d;--warn:#f2c36b;--warn-bg:#33290f;--err:#ff8c8c;--chip:#222c38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header h1{margin:0;font-size:1.6rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:2px 10px}
header p{margin:.4rem 0 0;color:var(--sub)}
form{margin-top:20px}
label{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer}
#go{padding:12px 20px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:700}
#go:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hint{color:var(--sub);font-size:.85rem;margin-top:6px}
h2{font-size:1rem;margin:26px 0 8px}
.ex{display:flex;flex-wrap:wrap;gap:8px}
.ex button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;text-align:left}
.ex button b{color:var(--brand);margin-right:6px}
#out{margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.status{font-size:.8rem;font-weight:700;color:var(--brand);margin-bottom:6px}
.status.unknown,.status.clarify,.status.planned{color:var(--warn)}
.status.error,.status.blocked{color:var(--err)}
.answer{font-size:1.1rem;margin:0 0 12px;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.chips li{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.8rem}
.chips li.alert{background:var(--warn-bg);color:var(--warn)}
.note{font-size:.88rem;color:var(--sub);margin:6px 0}
.tablebox{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:.88rem;min-width:100%}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap}
th{background:var(--chip)}
ul.docs,ul.src{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.docs li,.src li{margin:3px 0}
a{color:var(--brand)}
footer{margin-top:32px;color:var(--sub);font-size:.82rem}
.spin{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>채산 <span class="tag">비공식</span></h1>
<p>한국체육산업개발의 개방 데이터와 공개 기록을 근거로, <strong>출처와 함께</strong> 답하는 길라잡이예요. 근거가 없으면 지어내지 않고 "모른다"고 해요.</p>
</header>
<main>
<form id="f" autocomplete="off">
<label for="q">궁금한 것을 물어보세요</label>
<div class="row"><input id="q" type="text" maxlength="200" required placeholder="예: 올림픽공원 주차장은 몇 시에 가장 붐벼?"><button id="go" type="submit">묻기</button></div>
<div class="hint">200자까지. 개인정보(이름·전화번호)는 쓰지 마세요. 질문 원문은 저장하지 않아요.</div>
</form>
<section aria-labelledby="exh"><h2 id="exh">이런 걸 물어볼 수 있어요</h2><div class="ex" id="ex"></div></section>
<section id="out" aria-live="polite" aria-busy="false"></section>
</main>
<footer>
<p>채산은 한국체육산업개발의 공식 서비스가 아닌 <strong>비공식</strong> 안내입니다. 답은 공공데이터포털에 개방된 파일과 기관 누리집의 공개 기록에서 가져오며, 자료가 오래됐을 수 있어요(답마다 자료 기간을 보여 드려요). 정확한 사항은 기관에 확인하세요.</p>
</footer>
</div>
<script>
"use strict";
var EXAMPLES = [
  ["역사", "기관 연혁에서 2015년 12월에는 무슨 일이 있었어?"],
  ["시설·이용", "드론 비행 가능한가요?"],
  ["소식", "요즘 공원에 무슨 행사가 있어?"],
  ["기관 정보", "한체산이 공공데이터포털에 개방한 파일 목록은 모두 몇 건이야?"],
  ["데이터", "올림픽공원 주차장은 몇 시에 가장 붐벼?"]
];
var STATUS = {answered: "답변", unknown: "근거를 찾지 못했어요", clarify: "확인이 필요해요", planned: "연결 예정", blocked: "처리할 수 없는 질문", error: "오류"};
var $ = function (id) { return document.getElementById(id); };

// 모든 글자는 textContent로만 넣는다(서버 응답·데이터 속 문장이 HTML로 해석되지 않게). 링크는 http(s)만.
function el(tag, text, cls) {
  var e = document.createElement(tag);
  if (text !== undefined && text !== null) { e.textContent = String(text); }
  if (cls) { e.className = cls; }
  return e;
}
function safeLink(url, label) {
  if (typeof url === "string" && /^https?:\/\//i.test(url)) {
    var a = el("a", label); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; return a;
  }
  return el("span", label);
}

function render(d) {
  var out = $("out"); out.textContent = "";
  var card = el("div", null, "card");
  card.appendChild(el("div", STATUS[d.status] || d.status, "status " + d.status));
  card.appendChild(el("p", d.answer, "answer"));
  var chips = [].concat(d.badges || []);
  if (chips.length) {
    var ul = el("ul", null, "chips");
    chips.forEach(function (b) { ul.appendChild(el("li", b, /갱신 안 됨|확인하세요|다를 수|본문 없음/.test(b) ? "alert" : "")); });
    card.appendChild(ul);
  }
  (d.corrections || []).forEach(function (c) { card.appendChild(el("p", "✎ " + c, "note")); });
  var rows = d.evidence_rows || [];
  if (rows.length) {
    var keys = Object.keys(rows[0]);
    var box = el("div", null, "tablebox"), t = el("table"), head = el("tr");
    keys.forEach(function (k) { head.appendChild(el("th", k)); });
    t.appendChild(head);
    rows.slice(0, 20).forEach(function (r) {
      var tr = el("tr"); keys.forEach(function (k) { tr.appendChild(el("td", r[k])); }); t.appendChild(tr);
    });
    box.appendChild(t); card.appendChild(box);
    if (rows.length > 20) { card.appendChild(el("p", "위 표는 " + rows.length + "행 중 앞의 20행이에요.", "note")); }
  }
  var docs = d.documents || [];
  if (docs.length) {
    var dl = el("ul", null, "docs");
    docs.forEach(function (x) {
      var li = el("li");
      li.appendChild(el("span", (x.date || "날짜 없음") + "  "));
      li.appendChild(safeLink(x.url, x.title));
      li.appendChild(el("span", "  · " + x.source + (x.body_available ? "" : " · 본문 없음")));
      dl.appendChild(li);
    });
    card.appendChild(dl);
  }
  var src = d.sources || [];
  if (src.length) {
    card.appendChild(el("p", "출처", "note"));
    var sl = el("ul", null, "src");
    src.forEach(function (s) {
      var li = el("li"); li.appendChild(safeLink(s.url, s.name + "(" + s.id + ")"));
      li.appendChild(el("span", s.period ? "  · 자료 기간 " + s.period : "")); sl.appendChild(li);
    });
    card.appendChild(sl);
  }
  if ((d.unsupported_numbers || []).length) {
    card.appendChild(el("p", "답 문장 속 숫자 중 근거에서 확인되지 않은 것(" + d.unsupported_numbers.join(", ") + ")은 빼고 보여 드려요.", "note"));
  }
  card.appendChild(el("p", d.notice, "note"));
  out.appendChild(card);
}

function fail(message) {
  var out = $("out"); out.textContent = "";
  var card = el("div", null, "card");
  card.appendChild(el("div", "알림", "status error"));
  card.appendChild(el("p", message, "answer"));
  out.appendChild(card);
}

async function ask(question) {
  var out = $("out"), btn = $("go");
  btn.disabled = true; out.setAttribute("aria-busy", "true");
  out.textContent = ""; out.appendChild(el("p", "찾아보는 중이에요… (보통 3~10초)", "spin"));
  try {
    var res = await fetch("/api/chaesan/ask", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({question: question})});
    var data = {}; try { data = await res.json(); } catch (e) { data = {}; }
    if (res.ok) { render(data); }
    else if (res.status === 429) { fail("질문이 너무 빠르게 이어졌어요. 잠시 후 다시 물어봐 주세요."); }
    else if (res.status === 422) { fail("질문은 1자 이상 200자 이하로 써 주세요."); }
    else { fail(typeof data.detail === "string" ? data.detail : "지금은 답을 만들 수 없어요. 잠시 후 다시 시도해 주세요."); }
  } catch (e) {
    fail("서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.");
  } finally {
    btn.disabled = false; out.setAttribute("aria-busy", "false");
  }
}

EXAMPLES.forEach(function (ex) {
  var b = el("button", null); b.type = "button";
  b.appendChild(el("b", ex[0])); b.appendChild(document.createTextNode(ex[1]));
  b.addEventListener("click", function () { $("q").value = ex[1]; ask(ex[1]); });
  $("ex").appendChild(b);
});
$("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var q = $("q").value.trim();
  if (q) { ask(q); }
});
</script>
</body>
</html>
