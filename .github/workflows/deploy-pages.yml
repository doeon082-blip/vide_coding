name: Deploy 채산 화면(예비 정적 페이지) to GitHub Pages

# 수동 실행 전용: main에 합쳐질 때마다 저절로 공개되지 않게 한다. 공개 시점은 사람이 정한다(Actions 탭 → Run workflow).
# 이 주소에는 서버가 없어서 화면이 자동으로 '예비 모드'(미리 계산한 예시 답만)로 동작한다(js/lib/mode.js).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 빌드 단계는 없다. 화면의 순수 함수 시험(의존성 없음)만 통과하면 올린다.
      - run: npm test
        working-directory: frontend
      - name: 올릴 파일만 모으기(시험·설정 파일 제외)
        run: |
          mkdir _site
          cp -r frontend/index.html frontend/privacy.html frontend/favicon.svg frontend/css frontend/js frontend/img frontend/data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
